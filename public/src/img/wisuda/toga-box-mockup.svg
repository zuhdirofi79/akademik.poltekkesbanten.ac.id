<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Mockup Paket Toga Wisuda Poltekkes Kemenkes Banten">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="gownGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="520" rx="28" fill="#f1f5f9"/>
  <rect x="70" y="78" width="500" height="360" rx="28" fill="url(#boxGrad)" stroke="#94a3b8" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="70" y="78" width="500" height="78" rx="28" fill="url(#lidGrad)"/>
  <rect x="70" y="132" width="500" height="24" fill="#0f766e"/>
  <text x="320" y="128" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Paket Toga Wisuda</text>
  <text x="320" y="168" text-anchor="middle" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="13">Poltekkes Kemenkes Banten</text>

  <!-- gown -->
  <path d="M250 210 L320 245 L390 210 L420 390 L320 430 L220 390 Z" fill="url(#gownGrad)"/>
  <path d="M250 210 L320 245 L390 210 L370 250 L320 270 L270 250 Z" fill="#0f172a"/>
  <!-- sleeves -->
  <path d="M250 210 L210 280 L250 300 L270 250 Z" fill="#111827"/>
  <path d="M390 210 L430 280 L390 300 L350 250 Z" fill="#111827"/>

  <!-- samir -->
  <path d="M295 260 L320 300 L345 260 L335 255 L320 280 L305 255 Z" fill="#1aa0b8"/>
  <circle cx="320" cy="255" r="10" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>

  <!-- cap -->
  <ellipse cx="320" cy="198" rx="58" ry="14" fill="#111827"/>
  <rect x="262" y="176" width="116" height="22" rx="4" fill="#0f172a"/>
  <line x1="320" y1="176" x2="390" y2="160" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="390" cy="160" r="6" fill="#f59e0b"/>

  <!-- slebber / collar accent -->
  <path d="M290 248 L320 268 L350 248" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- labels -->
  <rect x="108" y="360" width="120" height="34" rx="10" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="168" y="382" text-anchor="middle" fill="#0e7490" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Jubah + Cap</text>
  <rect x="260" y="360" width="120" height="34" rx="10" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="320" y="382" text-anchor="middle" fill="#0e7490" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Samir Prodi</text>
  <rect x="412" y="360" width="120" height="34" rx="10" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="472" y="382" text-anchor="middle" fill="#0e7490" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Slebber</text>

  <text x="320" y="430" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">Sesuai ketentuan Poltekkes Kemenkes Banten</text>
</svg>
